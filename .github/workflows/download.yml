# Builds the download to try it out (the app and its example notes as a folder that opens from the disk, with no
# server, no token and no internet) and adds it to the release as commonplace-md-<tag>.zip, so it's never older
# than the site. Runs when a release is published; Run workflow builds it again for a tag that has
# tools/download/ (it replaces that release's zip).
name: Download

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, e.g. v0.5.0"
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # esbuild comes from the vendor build's own locked packages.
      - name: Install the build's packages
        working-directory: tools/vendor
        run: npm ci --no-audit --no-fund
      - name: Check
        run: npm test
      - name: Build the download
        run: node tools/download/build.mjs "$TAG"
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/commonplace-md-$TAG.zip" --clobber
