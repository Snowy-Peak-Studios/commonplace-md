# Serves the app on GitHub Pages: the released version (main) at the site's address, and the version in
# development (dev) under dev/ beside it, both rebuilt when either branch moves. Settings › This device picks
# which one a device opens. Needs Settings › Pages › Source: GitHub Actions, and the github-pages
# environment allowing both branches to deploy. The files are served as they are: there's no build step.
name: Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A private copy of the repo doesn't publish: Pages would make it public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: site/dev
      # The code graph for agents and people: graphify reads the code alone (code-only, no AI model, no key) and
      # writes graph.json and the clickable graph.html into graphify-out/, served at dev/graphify-out/graph.html
      # (and at the site's own graphify-out/ once main has a .graphifyignore). A failure here never stops a deploy.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the code graph
        continue-on-error: true
        run: |
          pip install --quiet graphifyy==0.9.92
          dirs="site/dev"
          if [ -f site/.graphifyignore ]; then echo >> site/.graphifyignore; echo "dev/" >> site/.graphifyignore; dirs="site/dev site"; fi
          for d in $dirs; do
            (cd "$d" && graphify extract . --code-only --no-cluster && graphify cluster-only . --no-label)
            rm -rf "$d/graphify-out/cache" "$d/graphify-out/manifest.json" "$d"/graphify-out/.graphify_*
          done
      - name: Name the version in development
        run: |
          rm -rf site/.git site/dev/.git site/.github site/dev/.github
          python3 - <<'PY'
          import json
          path = "site/dev/manifest.webmanifest"
          m = json.load(open(path, encoding="utf-8"))
          m["name"] = m["name"] + " (dev)"
          m["short_name"] = m["short_name"] + " dev"
          with open(path, "w", encoding="utf-8", newline="") as f:
              json.dump(m, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
