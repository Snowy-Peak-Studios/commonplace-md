# Only reviewed releases are published. Development previews run locally.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Snowy-Peak-Studios/commonplace-md' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: https://snowy-peak-studios.github.io/commonplace-md/
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - name: Prepare released site and retire the old preview
        run: |
          rm -rf site/.git site/.github
          cp -R site/tools/retired-dev site/dev
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
